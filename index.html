<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Journey // The Nebula Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Allura&family=Alex+Brush&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Hardware-Accelerated Video (Zero Lag, 100% Smooth 60 FPS, Autoplay) -->
  <video id="cosmic-video" src="Cosmic_Journey.mp4" autoplay muted loop playsinline preload="auto"></video>

  <!-- Background Music (MP3 - Automatic Playback & Seamless Loop) -->
  <audio id="bg-music" autoplay loop preload="auto">
    <source src="Someone You Loved.mp3" type="audio/mpeg">
    <source src="Someone%20You%20Loved.mp3" type="audio/mpeg">
  </audio>

  <!-- Minimalist Cinematic Captions (Centered Cursive Calligraphy) -->
  <div class="captions-overlay">
    <p class="caption-text" id="cap-1">Under the quiet night, our journey into the cosmos begins...</p>
    <p class="caption-text" id="cap-2">Where the galaxies begin...</p>
    <p class="caption-text" id="cap-3">Drifting through luminous nebulae born from ancient stars...</p>
    <p class="caption-text" id="cap-4">Witnessing the fiery birth and radiance of planetary worlds...</p>
    <p class="caption-text" id="cap-5">At the edge of spacetime, where light falls into eternity...</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
